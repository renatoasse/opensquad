# Architecture Design: Mentor Léo LinkedIn Squad
# Generated by OpenSquad Architect
# Phase: Design

squad:
  name: "mentor-leo-linkedin"
  purpose: "Monitoramento de ideias SaaS do Acquire.com, diagnóstico estratégico 'Mentor Léo' e agendamento de conteúdo LinkedIn para Aline Builds."
  context: "squads/mentor-leo-linkedin/pipeline/data/research-brief.md"

agents:
  - name: "Ricardo Rastreador"
    role: "Especialista em busca e filtragem no Gmail"
    alliteration: "R"
    description: "Monitora a pasta 'Ideia de SaaS', extrai descrições do Acquire.com e apresenta para o usuário."
    skills:
      - "gmail-automation"
      - "web_fetch"

  - name: "Léo Lógica"
    role: "Mentor de Negócios & Estrategista SaaS"
    alliteration: "L"
    description: "Aplica o framework 'Arquiteto MVP' e o tom 'Mentor Léo' do NotebookLM para diagnosticar negócios."
    skills:
      - "web_search"

  - name: "Caio Copy"
    role: "Senior Copywriter & Ghostwriter"
    alliteration: "C"
    description: "Transforma diagnósticos em artigos, roteiros e textos de infográficos usando ganchos de autoridade."
    skills:
      - "web_search"

  - name: "Davi Design"
    role: "Diretor de Arte Visual"
    alliteration: "D"
    description: "Cria infográficos no Canva e imagens premium em IA seguindo a estética Dark Mode da Aline Builds."
    skills:
      - "canva-automation"
      - "image-ai-generator"

  - name: "Vera Veredito"
    role: "Editora-Chefe & Revisora Crítica"
    alliteration: "V"
    description: "Garante a qualidade final, tom de voz provocador e precisão das métricas SaaS."
    skills: []

  - name: "Sofia Social"
    role: "Social Media Manager & Publisher"
    alliteration: "S"
    description: "Agenda e publica o conteúdo finalizado no LinkedIn perfil da Aline via CLI."
    skills:
      - "linkedin-cli"

pipeline:
  trigger: "Toda segunda-feira (Weekly)"
  steps:
    - id: "scout"
      agent: "Ricardo Rastreador"
      task: "Acessar Gmail (pasta: Ideia de SaaS), pegar o e-mail mais recente, extrair os dados do Acquire.com e listar os pontos chave."
      checkpoint: "Aprovar o SaaS escolhido para o conteúdo da semana."
    
    - id: "diagnosis"
      agent: "Léo Lógica"
      task: "Analisar o SaaS sob a ótica do mercado brasileiro (Referência: Research Brief) e propor o diagnóstico estratégico 'Mentor Léo'."

    - id: "content_gen"
      agent: "Caio Copy"
      task: "Gerar 3 formatos de conteúdo para o LinkedIn: Artigo (denso), Vídeo (roteiro shorts) e Infográfico (texto central)."
    
    - id: "visual_gen"
      agent: "Davi Design"
      task: "Criar o infográfico visual no Canva e as imagens de fundo com IA para o post."
      checkpoint: "Validar estética das artes e infográficos."

    - id: "review"
      agent: "Vera Veredito"
      task: "Revisar todo o pacote (texto + imagem) garantindo que a CTA leve para Aline Builds e o tom seja persuasivo."

    - id: "schedule"
      agent: "Sofia Social"
      task: "Agendar a publicação no LinkedIn para as próximas 24h."
      checkpoint: "Clique em 'Publicar' para confirmar o envio via CLI."
