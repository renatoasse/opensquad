# LLM Routing Configuration — OpenSquad
# Define qual modelo cada funcionário usa, por squad.
# As chaves de API estão em squads/.env

default: claude
env_prefix: LLM_API_KEY_

models:
  claude:  claude-3-5-sonnet-20241022
  openai:  gpt-4o
  gemini:  gemini-2.0-flash
  deepseek: deepseek-chat
  qwen:    qwen2.5-72b-instruct
  kimi:    kimi-k2
  ollama:  llama3.3-70b

agents:

  # ─── 1. CRIADOR DE CONTEÚDO (12 agentes) ──────────────────────────────
  # Pesquisa e curadoria
  - id: ricardo-rastreador
    squad: criador-de-conteudo
    llm: gemini
  # Diagnóstico e lógica
