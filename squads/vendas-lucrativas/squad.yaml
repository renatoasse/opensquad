# Squad Configuration: Vendas Lucrativas
# Generated by OpenSquad Architect
# Version: 2.1.0

name: "vendas-lucrativas"
description: "Squad de vendas & inbound que fecha o ciclo semanal. Toda segunda às 20h, processa os blueprints, tria os leads da Prospecção B2B (sexta anterior), prepara propostas e gera relatório de conversão. Encerra o trabalho do Criador de Conteúdo + Prospecção B2B da semana anterior."
type: "sales_automation"
status: "active"

# Triggers
schedule:
  cron: "0 20 * * 1" # Segunda às 20:00 (BRT) — fecha ciclo da semana anterior
  timezone: "America/Sao_Paulo"

# Pipeline Definition
pipeline:
  steps:
    - id: "radar_blueprints"
      agent: "Barbara Blueprint"
      task: "Processar novos blueprints e primeiro contato"
      required: true

    - id: "funil_recuperacao"
      agent: "Leandro Funil"
      task: "Monitorar e recuperar carrinhos abandonados e blueprints não pagos"
      required: true

    - id: "sdr_triagem"
      agent: "Eleonora SDR"
      task: "Triar leads frios da Prospecção B2B (sexta) e Arquiteto MVP, qualificar potenciais clientes"
      required: true

    - id: "proposta_high_ticket"
      agent: "José Closer"
      task: "Redigir propostas personalizadas, criar links Hotmart e scripts WhatsApp para leads qualificados"
      required: true

    - id: "venda_consultiva"
      agent: "Flávio Fechador"
      task: "Venda consultiva Engine White-Label e High-Ticket"
      required: true

    - id: "recrutamento_afiliados"
      agent: "Gustavo Gestor"
      task: "Recrutar influenciadores e parceiros afiliados"
      required: true

    - id: "relatorio_vendas"
      agent: "Geórgia Gerente"
      task: "Relatório semanal de vendas: leads triados → propostas → fechamentos → faturamento"
      required: true

# Permissions & Data
storage:
  path: "squads/vendas-lucrativas/pipeline/output/"
  retention_days: 30

skills:
  - web_search
  - web_fetch
  - telegram-bridge

system_context:
  company: "_opensquad/_memory/company.md"
  preferences: "_opensquad/_memory/preferences.md"
  user: "_opensquad/_memory/user.md"
  agents: "_opensquad/_memory/agents.md"
  memory: "_opensquad/_memory/memory.md"
  claude: "_opensquad/_memory/claude.md"
  hotmart: "_opensquad/_memory/hotmart_rules.md"
  growth: "_opensquad/_memory/growth_trends_rules.md"
  sdr: "_opensquad/_memory/sdr_prompt.md"
