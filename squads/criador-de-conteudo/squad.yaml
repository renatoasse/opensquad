# Squad Configuration: Mentor Léo LinkedIn
# Generated by OpenSquad Architect
# Version: 3.1.0

name: "criador-de-conteudo"
description: "Geração de conteúdo Growth & Social Selling para LinkedIn e Twitter. Terças e quintas: Teresa analisa tendências IA e define o micro-SaaS da semana, Aurora cria posts de impacto com CTA Arquiteto MVP R$ 52, e o time produz artigos, threads, posts e infográficos. Ao final do dia, Geórgia compila relatório de métricas, conversões e insights."
type: "content_automation"
status: "active"

# Triggers
schedule:
  cron: "0 9 * * 2,4" # Terças e quintas às 09:00 AM (BRT)
  timezone: "America/Sao_Paulo"

# Pipeline Definition
pipeline:
  research_brief: "pipeline/data/research-brief.md"
  steps:
    - id: "gmail_scout"
      agent: "Ricardo Rastreador"
      task: "Busca e extração SaaS em tempo real"
      required: true

    - id: "mentor_diagnosis"
      agent: "Léo Lógica"
      task: "Diagnóstico Mentor Léo e Framework Arquiteto MVP"
      required: true

    - id: "checkpoint_review"
      type: "checkpoint"
      task: "Revisão e aprovação do diagnóstico pela Aline"
      required: true

    - id: "trend_analysis"
      agent: "Teresa Tendências"
      task: "Pesquisa de tendências IA, cruzamento com Ranking de Ideias e definição do micro-SaaS da semana"
      required: true

    - id: "content_strategy"
      agent: "Elias Estratégia"
      task: "Estratégia de conteúdo baseada na tendência definida pela Teresa"
      required: true

    - id: "brand_copy"
      agent: "Aurora Autoridade"
      task: "Posts de impacto LinkedIn + Twitter com CTA Arquiteto MVP R$ 52"
      required: true

    - id: "linkedin_copy"
      agent: "Lúcia Linkedin"
      task: "Criação de posts storytelling para LinkedIn corporativo"
      required: true

    - id: "twitter_ghost"
      agent: "Túlio Tuítes"
      task: "Criação de threads virais e hooks para Twitter/X"
      required: true

    - id: "copy_craft"
      agent: "Caio Copy"
      task: "Criação de Artigo, Threads (X) e Update GMB"
      required: true

    - id: "design_visual"
      agent: "Daniel Design"
      task: "Geração de Infográficos e Artes Multi-formato"
      required: true

    - id: "final_review"
      agent: "Vera Veredito"
      task: "Revisão Crítica de Tom de Voz e CTAs"
      required: true

    - id: "multi_publish"
      agent: "Sofia Social"
      task: "Publicação LinkedIn, X e Google Meu Negócio"
      required: true

    - id: "growth_report"
      agent: "Geórgia Gerente"
      task: "Relatório Growth & Social Selling com métricas, conversões e próximos passos"
      required: true

# Permissions & Data
storage:
